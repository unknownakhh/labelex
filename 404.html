<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page Not Found (404) | Labelex</title>
<meta name="robots" content="noindex, follow" />
<meta name="description" content="The page you were looking for could not be found. Browse Labelex products or get back to the homepage." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" href="/img/ui/labelex-favicon.png" />
<style>
  .e404 { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 80px 20px; }
  .e404-inner { max-width: 600px; }
  .e404-code { font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: clamp(96px, 22vw, 200px); line-height: 0.9; letter-spacing: -0.03em; color: var(--ink); margin: 0; }
  .e404-code .ex { color: var(--lime); }
  .e404 h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.01em; margin: 16px 0 12px; }
  .e404 p { font-size: 17px; line-height: 1.6; color: var(--ink-2); margin: 0 auto 32px; max-width: 460px; }
  .e404-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="logo"><img src="/img/logo/labelex-website-logo.png" alt="Labelex — Custom Label Manufacturing"></a>
    <div class="nav-links">
      <a href="/products/">Products</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/blog/">Blog</a>
    </div>
    <div class="nav-cta">
      <a href="/contact/#quote-form" class="btn-quote">Get Quote →</a>
    </div>
  </div>
</nav>

<!-- 404 -->
<main class="e404">
  <div class="e404-inner">
    <p class="e404-code">4<span class="ex">0</span>4</p>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved. Let's get you back on track — head to the homepage or browse our label products.</p>
    <div class="e404-actions">
      <a href="/" class="btn-primary">← Back to home</a>
      <a href="/products/" class="btn-ghost">View products</a>
    </div>
  </div>
</main>

</body>
</html>
